name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones
        run: npx capacitor-assets generate --android

      - name: Ajustes nativos (impressão)
        run: node scripts/android_patch.js

      - name: Sincronizar arquivos do app
        run: npx cap sync android

      - name: Usar a chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp android-overrides/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Temperaturas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
